services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: ./backend/src
      dockerfile: Ecosologic.Api/Dockerfile
    restart: unless-stopped
    environment:
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Auth__JwtKey: ${AUTH_JWT_KEY}
      Auth__AdminEmail: ${AUTH_ADMIN_EMAIL}
      Auth__AdminPassword: ${AUTH_ADMIN_PASSWORD}
      Hangfire__StorageSchema: ${HANGFIRE_STORAGE_SCHEMA:-hangfire}
      Hangfire__DashboardEnabled: ${HANGFIRE_DASHBOARD_ENABLED:-false}
      Crm__NotificationCron: ${CRM_NOTIFICATION_CRON:-*/5 * * * *}
      Tariffs__SyncCron: ${TARIFFS_SYNC_CRON:-0 3 1 * *}
      Tariffs__TimeZoneId: ${TARIFFS_TIMEZONE_ID:-America/Sao_Paulo}
      Tariffs__SourceUrl: ${TARIFFS_SOURCE_URL:-}
      Tariffs__HttpTimeoutSeconds: ${TARIFFS_HTTP_TIMEOUT_SECONDS:-30}
      Tariffs__MaxRetries: ${TARIFFS_MAX_RETRIES:-3}
      OCI_SECRET_OCID: ${OCI_SECRET_OCID:-}
      OCI_CONFIG_FILE: ${OCI_CONFIG_FILE:-/app/.oci/config}
      OCI_PROFILE: ${OCI_PROFILE:-DEFAULT}
      InternalSecrets__Token: ${INTERNAL_SECRETS_TOKEN:-}
      InternalSecrets__CacheSeconds: ${INTERNAL_SECRETS_CACHE_SECONDS:-300}
      InternalSecrets__VaultOcid: ${OCI_VAULT_OCID:-}
      InternalSecrets__SecretNames__N8N_API_KEY: ${OCI_SECRET_N8N_API_NAME:-N8N-APIKEY}
      InternalSecrets__SecretNames__TAVILY_API_KEY: ${OCI_SECRET_TAVILY_API_NAME:-TAVILY-API-KEY}
      InternalSecrets__SecretNames__TAVILY_MCP: ${OCI_SECRET_TAVILY_MCP_NAME:-TAVILY-MCP}
      InternalSecrets__SecretNames__9ROUTER_API_KEY: ${OCI_SECRET_9ROUTER_API_NAME:-9ROUTER-API-KEY}
      InternalSecrets__SecretNames__BRAVE_API_KEY: ${OCI_SECRET_BRAVE_API_NAME:-BRAVE-API-KEY}
      RegionalLeadEnrichment__WebhookUrl: ${REGIONAL_LEAD_WEBHOOK_URL:-}
      RegionalLeadEnrichment__WebhookToken: ${REGIONAL_LEAD_WEBHOOK_TOKEN:-}
      Email__Enabled: ${EMAIL_ENABLED:-true}
      Email__SmtpHost: ${EMAIL_SMTP_HOST:-${ALERT_SMTP_HOST:-}}
      Email__SmtpPort: ${EMAIL_SMTP_PORT:-${ALERT_SMTP_PORT:-587}}
      Email__SmtpUsername: ${EMAIL_SMTP_USERNAME:-${ALERT_SMTP_USERNAME:-}}
      Email__SmtpPassword: ${EMAIL_SMTP_PASSWORD:-${ALERT_SMTP_PASSWORD:-}}
      Email__FromAddress: ${EMAIL_FROM_ADDRESS:-${ALERT_SMTP_FROM:-}}
      Email__FromName: ${EMAIL_FROM_NAME:-Ecosologic}
      Email__LeadRecipient: ${EMAIL_LEAD_RECIPIENT:-${ALERT_SMTP_TO:-}}
      ASPNETCORE_ENVIRONMENT: Production
    ports:
      - "127.0.0.1:5157:8080"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - media-data:/app/wwwroot/uploads
      - api-data-protection-keys:/root/.aspnet/DataProtection-Keys
      - ${OCI_CONFIG_HOST_PATH:-/home/hannibal/.oci}:/app/.oci:ro

  web:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - api

  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB}
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_POSTGRESDB_SCHEMA: n8n
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_HOST: ${N8N_HOST:-n8n.localhost}
      N8N_PROTOCOL: ${N8N_PROTOCOL:-https}
      WEBHOOK_URL: ${N8N_WEBHOOK_URL:-https://n8n.localhost/}
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_SECURE_COOKIE: "true"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: ${N8N_EXECUTIONS_MAX_AGE:-168}
    ports:
      - "127.0.0.1:5678:5678"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - n8n-data:/home/node/.n8n

networks:
  default:
    name: ecosologic_default

volumes:
  postgres-data:
  media-data:
  api-data-protection-keys:
    name: ecosologic_api_data_protection_keys
  n8n-data:
