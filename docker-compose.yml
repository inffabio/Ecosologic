services:
  postgres:
    image: postgres:16-alpine
    container_name: ecosologic-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ecosologic
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ecosologic-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ecosologic"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ecosologic-postgres:
