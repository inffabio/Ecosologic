services:
  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks: [ecosologic]

  alertmanager:
    image: prom/alertmanager:v0.34.0
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/etc/alertmanager/alertmanager-entrypoint.sh"]
    command:
      - --config.file=/tmp/alertmanager.generated.yml
      - --storage.path=/alertmanager
    environment:
      ALERT_SMTP_HOST: ${ALERT_SMTP_HOST}
      ALERT_SMTP_PORT: ${ALERT_SMTP_PORT}
      ALERT_SMTP_FROM: ${ALERT_SMTP_FROM}
      ALERT_SMTP_TO: ${ALERT_SMTP_TO}
      ALERT_SMTP_USERNAME: ${ALERT_SMTP_USERNAME}
      ALERT_SMTP_PASSWORD: ${ALERT_SMTP_PASSWORD}
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./alertmanager-entrypoint.sh:/etc/alertmanager/alertmanager-entrypoint.sh:ro
      - alertmanager-data:/alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9093/-/healthy || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks: [ecosologic]

  grafana:
    image: grafana/grafana:12.1.1
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_DOMAIN: www.ecosologic.com.br
      GF_SERVER_ROOT_URL: https://www.ecosologic.com.br/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana-datasource.yml:/etc/grafana/provisioning/datasources/prometheus.yml:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on: [prometheus]
    networks: [ecosologic]

  node-exporter:
    image: prom/node-exporter:v1.9.1
    restart: unless-stopped
    command: ["--path.rootfs=/host"]
    pid: host
    volumes:
      - /:/host:ro,rslave
    networks: [ecosologic]

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    restart: unless-stopped
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    networks: [ecosologic]

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.17.1
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    networks: [ecosologic]

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.27.0
    restart: unless-stopped
    volumes:
      - ./blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    networks: [ecosologic]

volumes:
  prometheus-data:
  alertmanager-data:
  grafana-data:

networks:
  ecosologic:
    external: true
    name: ecosologic_default
