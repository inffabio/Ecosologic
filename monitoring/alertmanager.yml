global:
  resolve_timeout: 5m
  smtp_smarthost: '${ALERT_SMTP_HOST}:${ALERT_SMTP_PORT}'
  smtp_from: '${ALERT_SMTP_FROM}'
  smtp_hello: 'ecosologic.com.br'
  smtp_auth_username: '${ALERT_SMTP_USERNAME}'
  smtp_auth_password: '${ALERT_SMTP_PASSWORD}'
  smtp_require_tls: true

route:
  receiver: warning
  group_by: ['alertname', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers:
        - severity="critical"
      receiver: critical
      group_wait: 10s
      group_interval: 1m
      repeat_interval: 1h

receivers:
  - name: critical
    email_configs:
      - to: '${ALERT_SMTP_TO}'
  - name: warning
    email_configs:
      - to: '${ALERT_SMTP_TO}'
